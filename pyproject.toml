[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-evidence-agent"
version = "0.3.0"
description = "Bounded evidence retrieval with validated citations and explicit failure semantics"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
evidence-agent = "evidence_agent.cli:main"

[tool.setuptools.packages.find]
include = ["evidence_agent*"]

[tool.setuptools.package-data]
evidence_agent = ["data/*.json"]

