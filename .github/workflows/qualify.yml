name: Semantic and live qualification
on:
  push:
    branches: ['feature/semantic-retention-qualification']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.57,<5' 'sentencepiece>=0.2,<0.3'
          python -m pip freeze > semantic-environment.txt
      - name: Explicitly download pinned model
        run: python -m evidence_agent.semantic
      - name: Evaluate frozen development and held-out cases offline
        env:
          HF_HUB_OFFLINE: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python -m evaluations.semantic_score --dataset evaluations/labeled.json --output semantic-development.json
          python -m evaluations.semantic_score --dataset evaluations/heldout.json --output semantic-heldout.json
          python -m evidence_agent.cli 'reservation capacity' --claim 'A hold consumes available capacity while active.' --semantic --deadline-seconds 60 > semantic-service.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-qualification
          path: |
            semantic-*.json
            semantic-environment.txt
  live-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m benchmarks.live_retrieval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-retrieval
          path: live-retrieval.json
